<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111113">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>토익 단어 집중</title>
<style>
/* Words page (2026-11-19). Mobile first, one task per screen, big tap targets (>= 48px).
   Colours follow the main app (Radix slate + orange/indigo), light and dark. */
:root{--bg:#f0f0f3;--surface:#fcfcfd;--sunk:#e8e8ec;--line:#d9d9e0;--ink:#1c2024;--ink-2:#60646c;
  --accent:#cc4e00;--accent-solid:#cc4e00;--accent-ink:#fff;--accent-soft:#ffefd6;--navy:#3a5bc7;--navy-solid:#3e63dd;--navy-ink:#fff;--navy-soft:#edf2fe;
  --ok:#218358;--ok-bg:#e6f6eb;--no:#ce2c31;--no-bg:#feebec;--warn-bg:#fff7c2;
  --sans:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;--serif:Georgia,"Times New Roman",serif;--mono:ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111113;--surface:#18191b;--sunk:#212225;--line:#363a3f;--ink:#edeef0;--ink-2:#b0b4ba;
  --accent:#ffa057;--accent-solid:#f76b15;--accent-ink:#17120e;--accent-soft:#331e0b;--navy:#9eb1ff;--navy-solid:#9eb1ff;--navy-ink:#11131f;--navy-soft:#182449;
  --ok:#3dd68c;--ok-bg:#132d21;--no:#ff9592;--no-bg:#3b1219;--warn-bg:#302008;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(12px,env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
@media (max-width:430px){.hstat{display:none}}
header a,.link{color:var(--navy);text-decoration:none;font-size:14.5px}
.hstat{font-family:var(--mono);font-size:13.5px;color:var(--ink-2)}
main{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{margin:0 0 8px;font-size:18px}
.muted{color:var(--ink-2);font-size:14.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{min-height:48px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:16px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent-solid);border-color:var(--accent-solid);color:var(--accent-ink)}
.btn.navy{background:var(--navy-solid);border-color:var(--navy-solid);color:var(--navy-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);font-weight:500}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;min-height:96px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:13.5px;color:var(--ink-2)}.tile .v{font-family:var(--mono);font-size:26px;font-weight:700}.tile .d{font-size:13.5px;color:var(--ink-2)}
.tile.go{background:var(--accent-soft);border-color:var(--accent)}
.tile.rev{background:var(--navy-soft);border-color:var(--navy)}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 10px;cursor:pointer;white-space:nowrap;font-size:14.5px;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:700}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;cursor:pointer;text-align:left;min-height:64px}
.day b{display:block;font-size:15px}.day small{color:var(--ink-2);font-family:var(--mono);font-size:12.5px}
.day.done{border-color:var(--ok);background:var(--ok-bg)}.day.now{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--navy);transition:width .2s}
.wcard{min-height:340px;display:flex;flex-direction:column;gap:10px}
.pos{display:inline-block;font-size:12.5px;border-radius:99px;background:var(--navy-soft);color:var(--navy);padding:1px 10px}
.word{font-family:var(--serif);font-size:36px;line-height:1.2;font-weight:600;margin:6px 0 0}
.ko{font-size:20px;font-weight:700}
.ex{font-family:var(--serif);font-size:17px;line-height:1.6;background:var(--sunk);border-radius:10px;padding:10px 12px}
.ex .t{display:block;font-family:var(--sans);font-size:14.5px;color:var(--ink-2);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{font-size:13.5px;background:var(--sunk);border-radius:99px;padding:3px 10px}
.hint{font-size:14.5px;border-left:3px solid var(--accent);padding:2px 10px;color:var(--ink-2)}
.spk{border:0;background:var(--sunk);border-radius:99px;width:44px;height:44px;cursor:pointer;font-size:18px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:56px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font-size:16.5px;display:flex;gap:12px;align-items:center}
.opt .n{flex:none;width:28px;height:28px;border-radius:99px;border:1.5px solid var(--ink-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt.en{font-family:var(--serif);font-size:18px}
.qtype{font-size:13.5px;color:var(--ink-2)}
.prompt{font-size:26px;font-weight:700;line-height:1.35}.prompt.en{font-family:var(--serif)}
.prompt.sent{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.6}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--ink-2)}
.fb{border-radius:12px;padding:12px 14px;font-size:15px}.fb.ok{background:var(--ok-bg)}.fb.no{background:var(--no-bg)}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .w{font-family:var(--serif);font-size:17px;font-weight:600}.list .it .m{color:var(--ink-2);font-size:14.5px}
.star{border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--ink-2);min-width:40px;min-height:40px}
.star.on{color:var(--accent)}
input[type=search]{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:9}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.foot .btn{flex:1}
/* v2: part-of-speech colours (명사 navy, 동사 orange, 형용사 green, 부사 purple) */
:root{--pn:#3a5bc7;--pv:#cc4e00;--pa:#218358;--pd:#8e4ec6;--pp:#60646c}
@media (prefers-color-scheme:dark){:root{--pn:#9eb1ff;--pv:#ffa057;--pa:#3dd68c;--pd:#d19dff;--pp:#b0b4ba}}
.pk{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:1px 8px;border:1.5px solid currentColor;line-height:1.5}
.pk-n{color:var(--pn)}.pk-v{color:var(--pv)}.pk-adj{color:var(--pa)}.pk-adv{color:var(--pd)}.pk-x{color:var(--pp)}
mark.hl{background:transparent;color:inherit;font-weight:700;border-bottom:3px solid var(--pp);padding:0 1px}
mark.hl.pk-n{border-color:var(--pn)}mark.hl.pk-v{border-color:var(--pv)}mark.hl.pk-adj{border-color:var(--pa)}mark.hl.pk-adv{border-color:var(--pd)}
.why{font-size:14.5px;background:var(--sunk);border-radius:10px;padding:8px 12px}
.why b{margin-right:6px}
.fam{display:flex;flex-direction:column;gap:4px}
.fam div{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:16px}
.fam div.me{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header><a href="./" aria-label="토익 앱으로">← 토익 앱</a><h1>단어 집중</h1><a href="rules.html">기초 규칙</a><span class="hstat" id="hstat"></span></header>
  <main id="main"></main>
</div>
<div class="foot" id="foot" hidden><div class="in" id="footIn"></div></div>
<script src="data/vocab.js"></script>
<script>
"use strict";
(function(){
var V=(window.VOCAB||[]).filter(function(v){return v&&v.w&&v.ko});
var KEY="toeic800.words.v1",GAP=[0,1,2,4,7,15,30];
var COURSES=[
 {id:"tsl",name:"토익 빈출",d:"토익 자료에서 많이 나오는 순서 1,250",f:function(v){return v.src==="TSL"},sort:"rank"},
 {id:"phave",name:"구동사",d:"자주 쓰는 구동사 150",f:function(v){return v.src==="PHaVE"},sort:"rank"},
 {id:"phrase",name:"여러 단어 표현",d:"자주 쓰는 표현 448",f:function(v){return v.src==="PHRASE"},sort:"rank"},
 {id:"topic",name:"업무 주제",d:"회의 · 채용 · 구매 같은 장면별 538",f:function(v){return !v.src},sort:"topic"}];
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(n){var d=new Date();d.setHours(12);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var S=load();
function load(){var s;try{s=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){s=null}
  s=s||{};s.set=Object.assign({perDay:30,course:"tsl",auto:true,rate:0.95},s.set||{});s.w=s.w||{};s.log=s.log||{};return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("저장 공간이 부족합니다. 설정에서 내보내기 하세요.")}}
function ws(w){return S.w[w]||{b:0}}
function logAdd(k,n){var t=today(),L=S.log[t]||{neu:0,rev:0,ok:0,n:0};L[k]=(L[k]||0)+n;S.log[t]=L}

function courseWords(id){var c=COURSES.filter(function(x){return x.id===id})[0]||COURSES[0];
  var a=V.filter(c.f);if(c.sort==="rank")a.sort(function(x,y){return (x.rank||9999)-(y.rank||9999)});else a.sort(function(x,y){return x.topic<y.topic?-1:x.topic>y.topic?1:0});return a}
function chunk(a,n){var r=[];for(var i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r}
function dayStat(ws_){var learned=ws_.filter(function(v){return ws(v.w).b>0}).length;return{learned:learned,total:ws_.length,done:learned===ws_.length}}
function dueList(){var t=today();return V.filter(function(v){var s=S.w[v.w];return s&&s.b>0&&s.due&&s.due<=t}).sort(function(a,b){return (ws(a.w).due<ws(b.w).due)?-1:1})}
function streak(){var n=0;for(var i=0;i<400;i++){var L=S.log[addDays(-i)];if(L&&(L.neu||L.rev))n++;else if(i>0)break}return n}

// ---------- speech ----------
var VOICE=null;function pick(){try{var vs=speechSynthesis.getVoices();VOICE=vs.filter(function(v){return/en[-_]US/i.test(v.lang)})[0]||vs.filter(function(v){return/^en/i.test(v.lang)})[0]||null}catch(e){}}
try{if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick}}catch(e){}
function canSpeak(){try{return !!window.speechSynthesis&&typeof SpeechSynthesisUtterance!=="undefined"}catch(e){return false}}
function say(t){if(!canSpeak())return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=S.set.rate;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u)}catch(e){}}

// ---------- dom ----------
function h(tag,p){var e=document.createElement(tag);if(p)for(var k in p){var v=p[k];if(v==null||v===false)continue;
  if(k==="class")e.className=v;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else if(k==="html")e.innerHTML=v;else e.setAttribute(k,v===true?"":v)}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;(Array.isArray(c)?c:[c]).forEach(function(x){if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(String(x)))})}return e}
var M=document.getElementById("main"),FOOT=document.getElementById("foot"),FIN=document.getElementById("footIn");
function clear(e){while(e.firstChild)e.removeChild(e.firstChild);return e}
var toastT;function toast(m){var o=document.querySelector(".toast");if(o)o.remove();var t=h("div",{class:"toast",role:"status"},m);document.body.append(t);clearTimeout(toastT);toastT=setTimeout(function(){t.remove()},2200)}
function foot(btns){clear(FIN);if(!btns){FOOT.hidden=true;return}FOOT.hidden=false;btns.forEach(function(b){FIN.append(b)})}
function hstat(){var L=S.log[today()]||{};document.getElementById("hstat").textContent="오늘 "+((L.neu||0)+(L.rev||0))+"개 · 연속 "+streak()+"일"}
// ---------- v2: parts of speech, position rules, word family ----------
var PK={n:["명사","n"],v:["동사","v"],adj:["형용사","adj"],adv:["부사","adv"],prep:["전치사","x"],conj:["접속사","x"],phr:["표현","x"],pron:["대명사","x"],abbr:["약어","x"]};
function pk(p){p=String(p||"").split(/[\/ ·]/)[0].trim();var map={"명사":"n","동사":"v","형용사":"adj","부사":"adv","전치사":"prep"};p=map[p]||p;return PK[p]?{k:p,name:PK[p][0],cls:"pk-"+PK[p][1]}:{k:"x",name:p||"?",cls:"pk-x"}}
function pkTag(p){var o=pk(p);return h("span",{class:"pk "+o.cls},o.name)}
var RULE={
 n:"명사: 사람 · 물건 · 일의 이름. 관사(a, an, the) · 소유격(my, our, their) · 형용사 뒤, 전치사 뒤, 주어와 목적어 자리에 온다. 끝 모양 -tion -sion -ment -ness -ity -ance -ence, 사람은 -er -or -ant -ee.",
 v:"동사: 하는 일 · 상태. 주어 뒤, 조동사(will, can, must) 뒤 원형, to 뒤 원형 자리에 온다. 끝 모양 -ize -ify -ate -en.",
 adj:"형용사: 명사를 꾸민다. 명사 바로 앞(a reliable supplier) 이나 be동사 · become · remain 뒤(is available) 에 온다. 끝 모양 -ive -ous -able -ible -al -ful -less -ic -ent -ant.",
 adv:"부사: 동사 · 형용사 · 문장 전체를 꾸민다. 빼도 문장이 성립한다. 동사 앞뒤, 형용사 앞, be 와 p.p. 사이(was carefully reviewed) 에 온다. 대부분 -ly 로 끝난다.",
 prep:"전치사: 뒤에 명사(구)나 -ing 가 온다. 예: despite the rain, before leaving.",
 conj:"접속사: 뒤에 주어 + 동사(절)가 온다. 예: although it rained, because the store was closed.",
 phr:"표현: 여러 단어가 한 덩어리로 뜻을 만든다. 통째로 외우고 예문 속 자리를 같이 본다."};
var ART=/^(a|an|the|this|that|these|those|his|her|their|our|its|my|your|each|every|any|some|no|another)$/i,BE=/^(am|is|are|was|were|be|been|being|become|becomes|became|remain|remains|remained|seem|seems|seemed|stay|stays)$/i,
 MOD=/^(will|would|can|could|should|must|may|might|shall|to)$/i,PREP=/^(of|for|in|on|at|with|by|from|about|into|after|before|without|during|despite|through|upon|regarding)$/i;
function clue(before,p){var m=String(before||"").trim().match(/([A-Za-z']+)\W*$/);var pr=m?m[1]:"";if(!pr)return null;
  if(p==="n"&&ART.test(pr))return"앞에 '"+pr+"' 가 있어 명사 자리";
  if(p==="n"&&PREP.test(pr))return"전치사 '"+pr+"' 뒤라 명사 자리";
  if(p==="adj"&&BE.test(pr))return"'"+pr+"' 뒤에서 주어의 상태를 말하는 형용사 자리";
  if(p==="adj"&&ART.test(pr))return"'"+pr+"' 와 명사 사이라 형용사 자리";
  if(p==="v"&&MOD.test(pr))return"'"+pr+"' 뒤라 동사원형 자리";
  if(p==="adv")return"빼도 문장이 성립하는 꾸밈 자리라 부사";
  return null}
function famList(v){var out=[],seen={};(v.fam||[]).forEach(function(f){var m=String(f).match(/^(.+?)\((\w+)\)$/);if(m){var w=m[1].trim(),p=m[2];out.push({w:w,p:p});seen[w.toLowerCase()]=(seen[w.toLowerCase()]||0)+1}});
  out.forEach(function(x){x.dup=seen[x.w.toLowerCase()]>1});return out}
function famQ(v){var fl=famList(v).filter(function(x){return !x.dup&&!/\s/.test(x.w)});if(fl.length<3)return null;
  var ex=String(v.ex||""),re=/[A-Za-z][A-Za-z'-]*/g,tk;
  while((tk=re.exec(ex))){var low=tk[0].toLowerCase();
    for(var i=0;i<fl.length;i++){if(isForm(low,fl[i].w.toLowerCase())){
      var m={before:ex.slice(0,tk.index),after:ex.slice(tk.index+tk[0].length),ans:tk[0]};
      var o=shuffle([fl[i]].concat(shuffle(fl.filter(function(x){return x!==fl[i]})).slice(0,3)));
      return{v:v,t:"family",m:m,o:o.map(function(x){return x.w}),a:o.indexOf(fl[i]),hit:fl[i],fam:o}}}}
  return null}
// token is the form itself or a regular inflection of it (plural, past, -ing, 3rd person)
function isForm(t,w){if(t===w)return true;var b=w.replace(/e$/,""),y=w.replace(/y$/,"i");
  return [w+"s",w+"es",w+"d",w+"ed",b+"ing",b+"ed",w+"ing",y+"es",y+"ed"].indexOf(t)>=0}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function top(){window.scrollTo(0,0)}

// ---------- home ----------
var view={name:"home"};
function go(v){view=v;sess=null;render();top()}
function render(){hstat();clear(M);foot(null);({home:vHome,day:vDay,list:vList,set:vSet}[view.name]||vHome)()}
function vHome(){
  var cw=courseWords(S.set.course),days=chunk(cw,S.set.perDay),due=dueList();
  var ni=days.findIndex(function(d){return !dayStat(d).done});
  var seg=h("div",{class:"seg",role:"group","aria-label":"과정"});
  COURSES.forEach(function(c){seg.append(h("button",{"aria-pressed":S.set.course===c.id?"true":"false",onclick:function(){S.set.course=c.id;save();render()}},c.name))});
  var learned=cw.filter(function(v){return ws(v.w).b>0}).length;
